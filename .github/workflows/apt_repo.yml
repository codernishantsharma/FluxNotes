name: Generate and Update APT Repository

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to fetch .deb from (leave blank for latest)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  update-apt:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Check out code
        uses: actions/checkout@v4


      # ============================================================
      # GIT IDENTITY
      # ============================================================

      - name: Set up Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"


      # ============================================================
      # IMPORT EXISTING GPG PRIVATE KEY
      # ============================================================

      - name: Import GPG Private Key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}


      # ============================================================
      # INSTALL APT TOOLS
      # ============================================================

      - name: Install APT Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils


      # ============================================================
      # DETERMINE RELEASE TAG
      # ============================================================

      - name: Determine Release Tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          INPUT_TAG="${{ github.event.inputs.tag }}"

          if [ -z "$INPUT_TAG" ]; then
            TAG="$(gh release view --json tagName --jq '.tagName')"
          else
            TAG="$INPUT_TAG"
          fi

          echo "Using release tag: $TAG"

          echo "TAG=$TAG" >> "$GITHUB_ENV"


      # ============================================================
      # DOWNLOAD DEB TEMPORARILY
      # ============================================================

      - name: Download .deb from GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          mkdir -p all-dist

          echo "Downloading .deb from release: $TAG"

          gh release download "$TAG" \
            --pattern "*_amd64.deb" \
            --dir all-dist \
            || gh release download "$TAG" \
            --pattern "*.deb" \
            --dir all-dist

          echo ""
          echo "Downloaded packages:"

          find all-dist \
            -type f \
            -name "*.deb" \
            -printf '%f\n'


      # ============================================================
      # GENERATE APT METADATA
      # ============================================================

      - name: Generate APT Metadata
        env:

          # YOUR EXISTING GPG KEY
          GPG_KEY_ID: "DD3569D42FE4D492"

          # YOUR EXISTING GPG PASSPHRASE
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          GITHUB_REPOSITORY: ${{ github.repository }}

        run: |
          set -e

          echo "Creating APT repository structure..."

          mkdir -p repo/pool/main
          mkdir -p repo/dists/stable/main/binary-amd64


          # ========================================================
          # COPY DEB TEMPORARILY
          # ========================================================

          find all-dist \
            -type f \
            -name "*.deb" \
            -exec cp {} repo/pool/main/ \;


          cd repo


          # ========================================================
          # GENERATE PACKAGES
          # ========================================================

          echo "Generating Packages..."

          dpkg-scanpackages \
            pool/main \
            /dev/null \
            > dists/stable/main/binary-amd64/Packages


          # ========================================================
          # FIND DEB FILE
          # ========================================================

          DEB_FILE="$(
            find pool/main \
              -maxdepth 1 \
              -type f \
              -name "*.deb" \
              -printf '%f\n' \
              | head -n 1
          )"

          if [ -z "$DEB_FILE" ]; then
            echo "ERROR: No .deb file found."
            exit 1
          fi

          echo "DEB file: $DEB_FILE"


          # ========================================================
          # CONSTRUCT GITHUB RELEASE URL
          # ========================================================

          RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${DEB_FILE}"

          echo ""
          echo "Release download URL:"
          echo "$RELEASE_URL"


          # ========================================================
          # UPDATE Filename FIELD
          # ========================================================

          python3 <<PY
          import re
          from pathlib import Path

          packages_file = Path(
              "dists/stable/main/binary-amd64/Packages"
          )

          text = packages_file.read_text()

          release_url = "${RELEASE_URL}"

          if not re.search(
              r"^Filename:\s*.+$",
              text,
              flags=re.MULTILINE
          ):
              raise SystemExit(
                  "ERROR: No Filename field found in Packages."
              )

          text = re.sub(
              r"^Filename:\s*.+$",
              f"Filename: {release_url}",
              text,
              flags=re.MULTILINE
          )

          packages_file.write_text(text)

          print("")
          print("Updated Packages:")
          print(text)
          PY


          # ========================================================
          # COMPRESS PACKAGES
          # ========================================================

          echo "Compressing Packages..."

          gzip -kf \
            dists/stable/main/binary-amd64/Packages


          # ========================================================
          # REMOVE DEB
          #
          # It remains on GitHub Releases.
          # ========================================================

          rm -rf pool


          # ========================================================
          # GENERATE RELEASE
          # ========================================================

          echo "Generating Release..."

          apt-ftparchive release dists/stable/ \
            > dists/stable/Release


          cd dists/stable


          # ========================================================
          # CONFIGURE GPG
          # ========================================================

          echo "Configuring GPG..."

          mkdir -p "$HOME/.gnupg"
          chmod 700 "$HOME/.gnupg"

          cat > "$HOME/.gnupg/gpg.conf" <<'EOF'
          batch
          pinentry-mode loopback
          EOF

          cat > "$HOME/.gnupg/gpg-agent.conf" <<'EOF'
          allow-loopback-pinentry
          EOF

          gpgconf --kill gpg-agent || true


          # ========================================================
          # VERIFY EXISTING GPG KEY
          # ========================================================

          echo "Signing with GPG key: $GPG_KEY_ID"

          gpg \
            --batch \
            --list-secret-keys \
            --keyid-format LONG \
            "$GPG_KEY_ID"


          # ========================================================
          # CREATE Release.gpg
          # ========================================================

          echo "Creating Release.gpg..."

          gpg \
            --batch \
            --yes \
            --pinentry-mode loopback \
            --passphrase "$GPG_PASSPHRASE" \
            --local-user "$GPG_KEY_ID" \
            --armor \
            --detach-sign \
            --output Release.gpg \
            Release


          # ========================================================
          # CREATE InRelease
          # ========================================================

          echo "Creating InRelease..."

          gpg \
            --batch \
            --yes \
            --pinentry-mode loopback \
            --passphrase "$GPG_PASSPHRASE" \
            --local-user "$GPG_KEY_ID" \
            --clearsign \
            --output InRelease \
            Release


          echo ""
          echo "APT metadata generated successfully."


      # ============================================================
      # PUBLISH TO GH-PAGES
      # ============================================================

      - name: Publish APT Repository
        run: |
          set -e

          echo "Preparing GitHub Pages repository..."


          # ========================================================
          # SAVE ONLY REPOSITORY METADATA
          # ========================================================

          TEMP_REPO="$(mktemp -d)"

          cp -r repo/. "$TEMP_REPO/"


          # ========================================================
          # PUBLIC GPG KEY
          # ========================================================

          if [ -f public.key ]; then
            cp public.key "$TEMP_REPO/public.key"
          else
            echo "WARNING: public.key not found."
          fi


          # ========================================================
          # CNAME
          # ========================================================

          echo "repo.fluxnotes.nishantapps.in" \
            > "$TEMP_REPO/CNAME"


          # ========================================================
          # DELETE TEMPORARY DEB
          # ========================================================

          rm -rf all-dist
          rm -rf repo


          # ========================================================
          # SWITCH TO GH-PAGES
          # ========================================================

          git checkout --orphan gh-pages

          git rm -rf . || true

          git clean -fdx


          # ========================================================
          # COPY ONLY APT METADATA
          # ========================================================

          cp -r "$TEMP_REPO"/. .


          # ========================================================
          # SAFETY CHECK
          # ========================================================

          echo ""
          echo "Checking for files larger than 100 MB..."

          LARGE_FILES="$(
            find . \
              -type f \
              -size +100M \
              -not -path './.git/*'
          )"

          if [ -n "$LARGE_FILES" ]; then
            echo ""
            echo "ERROR: Large files detected:"
            echo "$LARGE_FILES"
            exit 1
          fi


          # ========================================================
          # SHOW FILES
          # ========================================================

          echo ""
          echo "Files being published:"

          find . \
            -type f \
            -not -path './.git/*' \
            -printf '%p (%s bytes)\n'


          # ========================================================
          # COMMIT
          # ========================================================

          git add .

          git commit \
            -m "Update APT repository for $TAG"


          # ========================================================
          # PUSH
          # ========================================================

          git push origin gh-pages --force


          echo ""
          echo "=========================================="
          echo "APT repository published successfully!"
          echo "=========================================="
