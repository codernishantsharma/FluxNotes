name: Generate and Update APT Repository

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to fetch .deb from (leave blank for latest)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  update-apt:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Import GPG Key
        id: gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Install APT tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils

      - name: Download .deb from GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          mkdir -p all-dist

          TAG="${{ github.event.inputs.tag }}"

          if [ -z "$TAG" ]; then
            echo "Downloading package from latest release..."

            gh release download \
              --pattern "*_amd64.deb" \
              --dir all-dist \
              || gh release download \
              --pattern "*.deb" \
              --dir all-dist
          else
            echo "Downloading package from release: $TAG"

            gh release download "$TAG" \
              --pattern "*_amd64.deb" \
              --dir all-dist \
              || gh release download "$TAG" \
              --pattern "*.deb" \
              --dir all-dist
          fi

          echo "Downloaded packages:"
          find all-dist -type f -name "*.deb" -print

      - name: Generate APT Metadata
        env:
          GPG_KEY_ID: ${{ steps.gpg.outputs.keyid }}
        run: |
          set -e

          mkdir -p repo/pool/main
          mkdir -p repo/dists/stable/main/binary-amd64

          find all-dist -name "*.deb" \
            -exec cp {} repo/pool/main/ \;

          cd repo

          echo "Generating Packages..."

          dpkg-scanpackages \
            pool/main \
            /dev/null \
            > dists/stable/main/binary-amd64/Packages

          gzip -kf \
            dists/stable/main/binary-amd64/Packages

          echo "Generating Release..."

          apt-ftparchive release dists/stable/ \
            > dists/stable/Release

          cd dists/stable

          echo "Signing with GPG key: $GPG_KEY_ID"

          gpg \
            --batch \
            --yes \
            --local-user "$GPG_KEY_ID" \
            --armor \
            --detach-sign \
            --output Release.gpg \
            Release

          gpg \
            --batch \
            --yes \
            --local-user "$GPG_KEY_ID" \
            --clearsign \
            --output InRelease \
            Release

          echo "APT metadata generated successfully."

          echo ""
          echo "Generated files:"
          ls -lah

      - name: Publish APT Repository
        run: |
          set -e

          git checkout --orphan gh-pages

          git rm -rf . || true

          cp -r repo/* .

          echo "repo.fluxnotes.nishantapps.in" > CNAME

          if [ -f ../public.key ]; then
            cp ../public.key public.key
          fi

          git add .

          git commit -m "Update APT repository"

          git push origin gh-pages --force

          echo "APT repository published successfully!"
